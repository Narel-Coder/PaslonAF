<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Count Pemilos Real-time</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Latar belakang diperbarui dengan gambar baru Anda */
            background-image: url('Untitled design (2).jpg');
            background-repeat: no-repeat;
            background-size: cover; /* Membuat gambar otomatis menyesuaikan dan menutupi layar */
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(157, 226, 255, 0.95); /* Sedikit lebih solid agar teks tetap terbaca jelas */
            backdrop-filter: blur(12px);
        }

        .number-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .btn-press {
            transition: transform 0.1s;
        }
        
        .btn-press:active {
            transform: scale(0.95);
        }

        /* Menyembunyikan tombol untuk perangkat PC/Laptop (menggunakan mouse) */
        @media (pointer: fine) {
            .mobile-only-btn {
                display: none !important;
            }
        }
    </style>
</head>
<body class="text-slate-800 antialiased p-4 md:p-8 flex flex-col items-center justify-center">

    <div id="loading-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-blue-50/90 backdrop-blur-sm">
        <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-blue-500 mb-4"></div>
        <p class="text-blue-800 font-semibold text-lg animate-pulse">Menghubungkan ke Server Real-time...</p>
    </div>
    <div id="app-content" class="w-full max-w-7xl mx-auto hidden flex-col items-center">
        
        <!-- Header -->
        <header class="text-center mb-12 w-full flex flex-col items-center justify-center mt-6">
            <h1 class="text-4xl md:text-5xl font-extrabold text-blue-900 tracking-tight mb-2 bg-white/95 inline-block px-8 py-5 rounded-3xl shadow-xl backdrop-blur-md border-4 border-white">
                PEMILU OSIS SMP AL-FATH BSD <span class="text-blue-600">2026</span>
            </h1>
        </header>

        <!-- Grid diubah menjadi 4 kolom untuk PC (lg:grid-cols-4) dan 2 kolom untuk tablet -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 w-full" id="candidates-container">
            <!-- Kartu Paslon akan dirender di sini oleh JavaScript -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, collection, onSnapshot, getDocs, increment } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCjB3g669HGbBdo3_PtBPRIHgQyWMcAYd4",
            authDomain: "pemilos-af.firebaseapp.com",
            projectId: "pemilos-af",
            storageBucket: "pemilos-af.firebasestorage.app",
            messagingSenderId: "253057739083",
            appId: "1:253057739083:web:06038786e51065cc4720ce"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Path ke koleksi data di Firestore Anda
        const candidatesCollectionPath = "candidates";

        // =========================================================================
        // PENGATURAN DATA PASLON (GANTI LINK GAMBAR DI SINI)
        // =========================================================================
        // Anda bisa mengganti tulisan URL 'https://...' di bagian 'image' dengan 
        // link foto asli paslon (bisa upload foto ke imgur, discord, atau postimage).
        const defaultPaslons = [
            { id: 'paslon1', name: 'Azkia & Cumbita', order: 1, image: 'AzkiaCumbita.jpg' },
            { id: 'paslon2', name: 'Ayla & Naisya', order: 2, image: 'AylaNaisya.jpg' },
            { id: 'paslon3', name: 'Athaya & Syathir', order: 3, image: 'AthayaSyathir.jpg' },
            { id: 'paslon4', name: 'Fakhirah & Makaio', order: 4, image: 'FakhirahMakaio.jpg' }
        ];

        async function initAuth() {
            try {
                // Langsung login tanpa nama (Anonymous) dengan batasan waktu (timeout) 10 detik
                const authPromise = signInAnonymously(auth);
                const timeoutPromise = new Promise((_, reject) => 
                    setTimeout(() => reject(new Error("Koneksi timeout. Cek internet Anda.")), 10000)
                );
                
                await Promise.race([authPromise, timeoutPromise]);
                console.log("Autentikasi berhasil!");
                initDataAndListen();
            } catch (error) {
                console.error("Gagal autentikasi:", error);
                const loadingScreen = document.getElementById('loading-screen');
                loadingScreen.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-xl text-center max-w-sm m-4">
                        <p class="text-red-500 font-bold text-lg mb-2">Gagal Terhubung ⚠️</p>
                        <p class="text-slate-600 text-sm mb-4">Pastikan fitur "Authentication > Anonymous" di Firebase sudah Anda aktifkan.</p>
                        <code class="text-xs text-red-400 bg-red-50 p-2 rounded block text-left overflow-auto">${error.message}</code>
                    </div>
                `;
            }
        }

        function initDataAndListen() {
            const colRef = collection(db, candidatesCollectionPath);
            
            // Kita langsung pakai onSnapshot. Ini mengatasi masalah "stuck loading" 
            onSnapshot(colRef, (snapshot) => {
                
                // SISTEM PEMBARUAN OTOMATIS (Aman dari reset suara)
                // Memastikan 4 paslon dengan nama baru masuk ke database.
                defaultPaslons.forEach(async (p) => {
                    const existingDoc = snapshot.docs.find(d => d.id === p.id);
                    if (!existingDoc) {
                        // Jika paslon belum ada (misal paslon ke-4), buat baru
                        await setDoc(doc(db, candidatesCollectionPath, p.id), { ...p, votes: 0 });
                    } else {
                        // Jika sudah ada, update saja nama dan fotonya agar sesuai (tidak mengubah votes)
                        const data = existingDoc.data();
                        if (data.name !== p.name || data.image !== p.image) {
                            await updateDoc(doc(db, candidatesCollectionPath, p.id), { name: p.name, image: p.image });
                        }
                    }
                });

                if (snapshot.empty) return; // Tunggu data selesai dibuat
                
                let candidates = [];
                snapshot.forEach(docSnap => {
                    candidates.push({ id: docSnap.id, ...docSnap.data() });
                });
                
                // Urutkan berdasarkan 'order' supaya urutan paslon tidak acak
                candidates.sort((a, b) => a.order - b.order);
                
                // Render ke layar
                renderCandidates(candidates);
                
                // Sembunyikan loading screen setelah data berhasil masuk
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                document.getElementById('app-content').classList.add('flex');
            }, (error) => {
                console.error("Error mendengarkan pembaruan:", error);
                const loadingScreen = document.getElementById('loading-screen');
                loadingScreen.classList.remove('hidden');
                loadingScreen.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-xl text-center max-w-sm m-4">
                        <p class="text-red-500 font-bold text-lg mb-2">Akses Database Ditolak ⚠️</p>
                        <p class="text-slate-600 text-sm mb-4">Pastikan aturan <b>Firestore Database</b> Anda sudah diset ke "Start in test mode".</p>
                        <code class="text-xs text-red-400 bg-red-50 p-2 rounded block text-left overflow-auto">${error.message}</code>
                    </div>
                `;
            });
        }

        function renderCandidates(candidates) {
            const container = document.getElementById('candidates-container');
            container.innerHTML = ''; // Bersihkan container
            
            // Render maksimal 4 paslon teratas yang berurutan
            candidates.slice(0, 4).forEach((paslon, index) => {
                
                const cardHTML = `
                    <div class="glass-card rounded-3xl p-6 flex flex-col items-center relative overflow-hidden group w-full">
                        
                        <!-- Dekorasi latar belakang (lingkaran transparan) -->
                        <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-100 rounded-full opacity-50 group-hover:scale-110 transition-transform duration-500 z-0"></div>
                        
                        <!-- Avatar / Gambar Paslon -->
                        <div class="relative z-10 w-full aspect-square bg-white rounded-2xl flex flex-col items-center justify-center mb-6 shadow-lg border-4 border-white overflow-hidden">
                            <!-- object-contain agar seluruh gambar selalu muat tanpa terpotong -->
                            <img src="${paslon.image}" alt="${paslon.name}" class="w-full h-full object-contain transform transition-transform duration-700 group-hover:scale-105 p-1">
                        </div>
                        
                        <h2 class="relative z-10 text-xl font-bold text-slate-800 mb-4 text-center leading-snug min-h-[3.5rem] flex items-center justify-center">${paslon.name}</h2>
                        
                        <!-- Jumlah Suara -->
                        <div class="relative z-10 w-full bg-blue-50 rounded-2xl py-5 mb-5 text-center border border-blue-100/50">
                            <span class="text-[10px] font-bold text-blue-500 uppercase tracking-widest block mb-1">Total Suara</span>
                            <div class="number-transition text-5xl xl:text-6xl font-extrabold text-blue-900" id="vote-count-${paslon.id}">
                                ${paslon.votes || 0}
                            </div>
                        </div>
                        
                        <!-- Tombol Aksi (+ / -) Hanya untuk Mobile/Tablet -->
                        <div class="relative z-10 flex w-full gap-3 mt-auto mobile-only-btn">
                            <button onclick="updateVote('${paslon.id}', -1)" class="btn-press bg-white border-2 border-blue-100 hover:border-red-200 hover:bg-red-50 text-slate-400 hover:text-red-500 font-bold py-2.5 px-4 rounded-xl flex items-center justify-center shadow-sm">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M20 12H4"></path></svg>
                            </button>
                            <button onclick="updateVote('${paslon.id}', 1)" class="btn-press flex-1 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-bold py-2.5 px-4 rounded-xl flex items-center justify-center shadow-md shadow-blue-500/30">
                                <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                                Tambah
                            </button>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // Ekspos fungsi ke global window agar bisa dipanggil dari onclick HTML
        window.updateVote = async (paslonId, changeValue) => {
            if (!auth.currentUser) return; // Pastikan sudah login

            const docRef = doc(db, candidatesCollectionPath, paslonId);
            
            try {
                // Menggunakan increment dari Firestore untuk memastikan data akurat 
                // jika ada beberapa perangkat menekan tombol di detik yang sama
                await updateDoc(docRef, {
                    votes: increment(changeValue)
                });
                
                // Tambahkan efek animasi klik kecil pada angka
                const countEl = document.getElementById(`vote-count-${paslonId}`);
                if (countEl) {
                    countEl.style.transform = changeValue > 0 ? 'scale(1.1)' : 'scale(0.9)';
                    setTimeout(() => {
                        if (countEl) countEl.style.transform = 'scale(1)';
                    }, 150);
                }
                
            } catch (error) {
                console.error("Gagal update suara:", error);
                // Kita gunakan div pop-up sederhana sebagai ganti alert
                showNotification("Gagal mengubah suara. Coba lagi.");
            }
        };

        function showNotification(message) {
            const notif = document.createElement('div');
            notif.className = "fixed bottom-5 right-5 bg-red-500 text-white px-6 py-3 rounded-xl shadow-lg transform transition-all duration-300 translate-y-10 opacity-0 z-50";
            notif.innerText = message;
            document.body.appendChild(notif);
            
            setTimeout(() => {
                notif.classList.remove('translate-y-10', 'opacity-0');
            }, 10);
            
            setTimeout(() => {
                notif.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => notif.remove(), 300);
            }, 3000);
        }

        // Mulai aplikasi
        initAuth();

    </script>
</body>
</html>
