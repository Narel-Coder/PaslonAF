<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEMILOS AF 26/27 - Live Sync</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- Configure Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                            950: '#172554',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
        }

        /* Glassmorphism for Login */
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        /* Premium Card Hover Effects */
        .paslon-card-desktop {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .paslon-card-desktop:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -10px rgba(37, 99, 235, 0.15);
        }

        /* Pop Animation for numbers */
        @keyframes popNumber {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); color: #2563eb; }
            100% { transform: scale(1); }
        }
        .animate-pop {
            animation: popNumber 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Background animated blobs for Login Screen */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }

        /* Hide scrollbar for cleaner look but keep functionality */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative overflow-x-hidden selection:bg-brand-100 selection:text-brand-900">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 w-full max-w-sm px-4 pointer-events-none"></div>

    <!-- Screen 1: Login / Splash Screen -->
    <div id="login-screen" class="flex flex-col items-center justify-center min-h-screen p-4 bg-gradient-to-br from-brand-900 to-brand-950 text-white relative w-full">
        <!-- Decorative Blobs -->
        <div class="absolute top-0 left-1/4 w-72 h-72 bg-brand-500 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob"></div>
        <div class="absolute top-20 right-1/4 w-72 h-72 bg-cyan-400 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob animation-delay-2000"></div>

        <div class="relative z-10 w-full max-w-md glass-panel p-8 rounded-[2rem] text-center">
            <div class="mb-8">
                <h1 class="text-4xl md:text-5xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-white to-brand-200 tracking-tight">
                    PEMILOS
                </h1>
                <h2 class="text-xl font-bold tracking-[0.2em] text-brand-200 mb-4">AF 26/27</h2>
                <div class="w-12 h-1 bg-brand-500 mx-auto rounded-full mb-4"></div>
                <p class="text-sm text-brand-100/80 leading-relaxed font-light">
                    Masuk dengan akun Google yang sama di HP dan Laptop untuk menghubungkan perangkat secara *real-time*.
                </p>
            </div>

            <button id="btn-google-login" class="w-full flex items-center justify-center gap-3 bg-white text-slate-800 font-bold py-4 px-6 rounded-2xl shadow-xl hover:shadow-2xl hover:scale-[1.02] active:scale-95 transition-all duration-200 text-lg group">
                <svg class="w-6 h-6 group-hover:scale-110 transition-transform" viewBox="0 0 48 48">
                    <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C12.955 4 4 12.955 4 24s8.955 20 20 20c11.045 0 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                    <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C16.318 4 9.656 8.337 6.306 14.691z"/>
                    <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                    <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
                </svg>
                Sign in with Google
            </button>
        </div>
    </div>

    <!-- Screen 2: Main Dashboard (Hidden by default) -->
    <div id="main-app" class="hidden flex-col min-h-screen w-full bg-slate-50">
        
        <!-- Header -->
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex flex-col md:flex-row justify-between items-center z-20 sticky top-0 shadow-sm gap-4">
            <div class="text-center md:text-left">
                <h1 class="text-2xl md:text-3xl font-black text-brand-900 tracking-tight">PEMILOS AF 26/27</h1>
                <p id="user-display" class="text-xs md:text-sm text-slate-500 font-semibold mt-0.5">
                    Memuat data akun...
                </p>
            </div>
            
            <div class="flex items-center gap-4">
                <div id="mode-badge" class="px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider transition-colors">
                    Mendeteksi Layar...
                </div>
                <button id="btn-logout" class="text-sm font-bold text-slate-400 hover:text-red-500 transition-colors py-2 px-3 rounded-lg hover:bg-red-50">
                    Keluar
                </button>
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <main class="flex-1 w-full flex items-center justify-center p-4 md:p-8">
            
            <!-- Desktop Layout (Preview) -->
            <div id="desktop-view" class="hidden md:flex w-full max-w-7xl gap-6 lg:gap-10 justify-center h-full items-center">
                <!-- Injected via JS -->
            </div>

            <!-- Mobile Layout (Controller) -->
            <div id="mobile-view" class="flex md:hidden w-full max-w-md flex-col gap-4 pb-12">
                <!-- Injected via JS -->
            </div>

        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut, signInWithCustomToken, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Configurations
        const appId = typeof window !== 'undefined' && window.__app_id ? window.__app_id : 'pemilos-app-v2';
        const firebaseConfig = typeof window !== 'undefined' && window.__firebase_config 
            ? JSON.parse(window.__firebase_config) 
            : { apiKey: "mock", projectId: "mock" }; // Fallback for local testing outside platform

        // Data Paslon (Kotak dengan border-radius / rounding)
        const candidates = [
            { id: '1', name: 'Budi & Citra', img: 'https://placehold.co/400x400/1e3a8a/ffffff?text=Paslon+1' },
            { id: '2', name: 'Dimas & Eka', img: 'https://placehold.co/400x400/1e3a8a/ffffff?text=Paslon+2' },
            { id: '3', name: 'Fajar & Gita', img: 'https://placehold.co/400x400/1e3a8a/ffffff?text=Paslon+3' }
        ];

        // State variables
        let app, auth, db, currentUser = null;
        let unsubscribeSnapshot = null;
        let currentVotes = { '1': 0, '2': 0, '3': 0 };

        // --- UI Helper Functions ---
        function showToast(message, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            // Base styles
            toast.className = `w-full px-6 py-3 rounded-2xl text-sm font-bold shadow-2xl transform transition-all duration-500 -translate-y-full opacity-0 flex items-center justify-center text-center backdrop-blur-md border ${
                isError ? 'bg-red-500/90 text-white border-red-400' : 'bg-brand-600/90 text-white border-brand-500'
            }`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            // Trigger animation in
            requestAnimationFrame(() => {
                toast.classList.remove('-translate-y-full', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');
            });

            // Trigger animation out and remove
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-full', 'opacity-0');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        function updateDeviceMode() {
            const badge = document.getElementById('mode-badge');
            const isMobile = window.innerWidth < 768; // 768px is Tailwind's 'md' breakpoint
            
            if (isMobile) {
                badge.textContent = "📱 Mode Remote (HP)";
                badge.className = "px-4 py-1.5 rounded-full text-[10px] sm:text-xs font-bold uppercase tracking-wider bg-orange-100 text-orange-700 border border-orange-200 transition-colors";
            } else {
                badge.textContent = "💻 Mode Layar (Desktop)";
                badge.className = "px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-emerald-100 text-emerald-700 border border-emerald-200 transition-colors";
            }
        }

        // --- Render UI ---
        function renderLayouts() {
            const desktopContainer = document.getElementById('desktop-view');
            const mobileContainer = document.getElementById('mobile-view');
            
            desktopContainer.innerHTML = '';
            mobileContainer.innerHTML = '';

            candidates.forEach(paslon => {
                // 1. DESKTOP VIEW (Big screen, no buttons)
                const desktopCard = document.createElement('div');
                desktopCard.className = "flex-1 max-w-[380px] bg-white rounded-[2.5rem] p-8 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 flex flex-col items-center paslon-card-desktop";
                desktopCard.innerHTML = `
                    <div class="bg-brand-50 text-brand-600 px-5 py-2 rounded-full text-sm font-black uppercase tracking-widest mb-6 border border-brand-100">
                        Nomor Urut ${paslon.id}
                    </div>
                    
                    <!-- Kotak dengan rounding kecil (rounded-3xl) -->
                    <div class="w-48 h-48 lg:w-56 lg:h-56 rounded-3xl overflow-hidden border-[6px] border-white shadow-xl mb-6 bg-slate-50 relative">
                        <img src="${paslon.img}" alt="${paslon.name}" class="w-full h-full object-cover" />
                        <div class="absolute inset-0 rounded-3xl shadow-[inset_0_0_20px_rgba(0,0,0,0.05)] pointer-events-none"></div>
                    </div>
                    
                    <h2 class="text-3xl font-black text-slate-800 text-center mb-8">${paslon.name}</h2>
                    
                    <div class="w-full bg-slate-50 rounded-3xl p-6 text-center border border-slate-100 relative overflow-hidden group">
                        <div class="absolute -right-4 -top-4 w-24 h-24 bg-brand-100 rounded-full opacity-50 blur-2xl group-hover:bg-brand-200 transition-colors"></div>
                        <span class="relative block text-xs text-slate-400 font-bold uppercase tracking-[0.2em] mb-2 z-10">Total Suara</span>
                        
                        <div id="desktop-vote-${paslon.id}" class="relative z-10 text-7xl lg:text-8xl font-black text-brand-600 tracking-tighter">
                            0
                        </div>
                    </div>
                `;
                desktopContainer.appendChild(desktopCard);

                // 2. MOBILE VIEW (Small screen, with buttons)
                const mobileCard = document.createElement('div');
                mobileCard.className = "bg-white rounded-3xl p-4 flex items-center justify-between shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100";
                mobileCard.innerHTML = `
                    <div class="flex items-center gap-4">
                        <!-- Kotak dengan rounding (rounded-2xl) -->
                        <div class="w-16 h-16 rounded-2xl overflow-hidden border-2 border-slate-100 shadow-sm flex-shrink-0 bg-slate-50">
                            <img src="${paslon.img}" alt="${paslon.name}" class="w-full h-full object-cover" />
                        </div>
                        <div>
                            <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-0.5">Paslon ${paslon.id}</div>
                            <h3 class="font-bold text-slate-800 leading-tight text-lg">${paslon.name}</h3>
                            <div class="flex items-baseline gap-1 mt-1">
                                <span id="mobile-vote-${paslon.id}" class="text-2xl font-black text-brand-600">
                                    0
                                </span>
                                <span class="text-[10px] text-slate-400 font-bold uppercase">Suara</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex flex-col gap-2">
                        <button onclick="window.modifyVote('${paslon.id}', 1)" class="w-12 h-12 bg-brand-600 text-white rounded-2xl flex items-center justify-center text-2xl font-bold shadow-lg shadow-brand-600/30 active:scale-90 active:bg-brand-700 transition-all">
                            +
                        </button>
                        <button onclick="window.modifyVote('${paslon.id}', -1)" class="w-12 h-10 bg-slate-100 text-slate-600 rounded-2xl flex items-center justify-center text-2xl font-bold active:scale-90 active:bg-slate-200 transition-all">
                            -
                        </button>
                    </div>
                `;
                mobileContainer.appendChild(mobileCard);
            });
        }

        // --- Data Binding & Sync ---
        function updateUIVotes(newVotes) {
            candidates.forEach(paslon => {
                const newValue = newVotes[paslon.id] || 0;
                
                // Get elements
                const desktopEl = document.getElementById(`desktop-vote-${paslon.id}`);
                const mobileEl = document.getElementById(`mobile-vote-${paslon.id}`);
                
                // Check if changed to trigger animation
                if (currentVotes[paslon.id] !== newValue) {
                    if (desktopEl) animateNumberChange(desktopEl, newValue);
                    if (mobileEl) animateNumberChange(mobileEl, newValue);
                } else {
                    // Initial set without animation
                    if (desktopEl) desktopEl.innerText = newValue;
                    if (mobileEl) mobileEl.innerText = newValue;
                }
            });
            
            currentVotes = { ...newVotes };
        }

        function animateNumberChange(element, newValue) {
            element.innerText = newValue;
            element.classList.remove('animate-pop');
            
            // Force browser reflow to restart CSS animation
            void element.offsetWidth; 
            
            element.classList.add('animate-pop');
            
            // Clean up class after animation ends (400ms based on CSS)
            setTimeout(() => {
                element.classList.remove('animate-pop');
            }, 400);
        }

        window.modifyVote = async function(paslonId, delta) {
            if (!currentUser || currentUser.isAnonymous) {
                showToast("Sesi tidak valid, silakan login ulang.", true);
                return;
            }

            // 1. Optimistic Update (Immediate visual feedback)
            const oldTotal = currentVotes[paslonId] || 0;
            const newTotal = Math.max(0, oldTotal + delta); // Prevent negative numbers
            
            const optimisticData = { ...currentVotes, [paslonId]: newTotal };
            updateUIVotes(optimisticData);

            // 2. Sync to Firestore (Private user space)
            const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'election_data', 'votes');
            try {
                await setDoc(docRef, { [paslonId]: newTotal }, { merge: true });
            } catch (error) {
                console.error("Gagal update:", error);
                showToast("Gagal menyimpan suara! Periksa koneksi internet.", true);
                // Revert if failed
                updateUIVotes(currentVotes); 
            }
        };

        // --- Authentication Flow ---
        function showMainApp(user) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('main-app').classList.add('flex');
            
            document.getElementById('user-display').innerHTML = `Akun: <span class="text-brand-600">${user.displayName || user.email}</span>`;
            
            renderLayouts(); // Render UI HTML dynamically
            
            // Start Firestore Listener
            const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'election_data', 'votes');
            
            unsubscribeSnapshot = onSnapshot(docRef, 
                (docSnap) => {
                    if (docSnap.exists()) {
                        updateUIVotes(docSnap.data());
                    } else {
                        // Initialize if first time
                        setDoc(docRef, { '1': 0, '2': 0, '3': 0 }).catch(console.error);
                    }
                },
                (error) => {
                    console.error("Sync error:", error);
                    showToast("Gagal menyinkronkan data dengan server.", true);
                }
            );
        }

        function showLoginApp() {
            if (unsubscribeSnapshot) {
                unsubscribeSnapshot();
                unsubscribeSnapshot = null;
            }
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('login-screen').classList.add('flex');
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('main-app').classList.remove('flex');
        }

        async function handleGoogleLogin() {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
                showToast("Berhasil login dengan Google!");
            } catch (error) {
                console.error("Login failed:", error);
                showToast("Gagal login: " + error.message, true);
            }
        }

        async function handleLogout() {
            try {
                await signOut(auth);
                // Fallback to anonymous/custom token after logout
                if (typeof window !== 'undefined' && window.__initial_auth_token) {
                    await signInWithCustomToken(auth, window.__initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                showToast("Berhasil keluar.");
                currentVotes = { '1': 0, '2': 0, '3': 0 }; // Reset local state
            } catch (error) {
                console.error("Logout failed:", error);
                showToast("Gagal keluar.", true);
            }
        }

        // --- Initialization ---
        async function init() {
            try {
                // Initialize Firebase Apps
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // Initial silent auth (required by environment)
                if (typeof window !== 'undefined' && window.__initial_auth_token) {
                    await signInWithCustomToken(auth, window.__initial_auth_token);
                } else {
                    // Local testing fallback
                    await signInAnonymously(auth);
                }

                // Listen to Auth State Changes
                onAuthStateChanged(auth, (user) => {
                    if (user && !user.isAnonymous) {
                        currentUser = user;
                        showMainApp(user);
                    } else {
                        currentUser = null;
                        showLoginApp();
                    }
                });

                // Bind Event Listeners
                document.getElementById('btn-google-login').addEventListener('click', handleGoogleLogin);
                document.getElementById('btn-logout').addEventListener('click', handleLogout);
                
                // Responsive Listeners
                window.addEventListener('resize', updateDeviceMode);
                updateDeviceMode(); // Initial check

            } catch (error) {
                console.error("Initialization Error:", error);
                showToast("Gagal memuat sistem. Coba muat ulang halaman.", true);
            }
        }

        // Start App
        window.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
