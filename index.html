<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Count Pemilos Real-time</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Latar belakang biru muda ke putih */
            background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(191, 219, 254, 0.5); /* blue-200 */
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.1), 0 8px 10px -6px rgba(59, 130, 246, 0.1);
        }

        .number-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .btn-press {
            transition: transform 0.1s;
        }
        
        .btn-press:active {
            transform: scale(0.95);
        }

        /* Menyembunyikan tombol untuk perangkat PC/Laptop (menggunakan mouse) */
        @media (pointer: fine) {
            .mobile-only-btn {
                display: none !important;
            }
        }
    </style>
</head>
<body class="text-slate-800 antialiased p-4 md:p-8 flex flex-col items-center justify-center">

    <div id="loading-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-blue-50/90 backdrop-blur-sm">
        <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-blue-500 mb-4"></div>
        <p class="text-blue-800 font-semibold text-lg animate-pulse">Menghubungkan ke Server Real-time...</p>
    </div>

    <div id="app-content" class="w-full max-w-6xl mx-auto hidden flex-col items-center">
        
        <!-- Header -->
        <header class="text-center mb-12 w-full">
            <div class="inline-block px-4 py-1 rounded-full bg-blue-100 text-blue-700 font-semibold text-sm mb-4 tracking-wider uppercase">
                Sistem Sinkronisasi Aktif
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold text-blue-900 tracking-tight mb-2">
                PEMILOS AF <span class="text-blue-500">26/27</span>
            </h1>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 w-full" id="candidates-container">
            <!-- Kartu Paslon akan dirender di sini oleh JavaScript -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, collection, onSnapshot, getDocs, increment } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCjB3g669HGbBdo3_PtBPRIHgQyWMcAYd4",
            authDomain: "pemilos-af.firebaseapp.com",
            projectId: "pemilos-af",
            storageBucket: "pemilos-af.firebasestorage.app",
            messagingSenderId: "253057739083",
            appId: "1:253057739083:web:06038786e51065cc4720ce"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Path ke koleksi data di Firestore Anda
        const candidatesCollectionPath = "candidates";

        async function initAuth() {
            try {
                // Langsung login tanpa nama (Anonymous)
                await signInAnonymously(auth);
                console.log("Autentikasi berhasil!");
                initDataAndListen();
            } catch (error) {
                console.error("Gagal autentikasi:", error);
                // Jika error, ubah tampilan loading menjadi pesan error
                const loadingScreen = document.getElementById('loading-screen');
                loadingScreen.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-xl text-center max-w-sm">
                        <p class="text-red-500 font-bold text-lg mb-2">Gagal Terhubung ⚠️</p>
                        <p class="text-slate-600 text-sm">Pastikan fitur "Authentication > Anonymous" di Firebase sudah Anda aktifkan (Enable).</p>
                    </div>
                `;
            }
        }

        async function initDataAndListen() {
            const colRef = collection(db, candidatesCollectionPath);
            
            try {
                // Cek apakah data sudah ada
                const snapshot = await getDocs(colRef);
                if (snapshot.empty) {
                    console.log("Data kosong, membuat paslon awal...");
                    // Bikin 3 paslon default
                    const p1 = setDoc(doc(db, candidatesCollectionPath, 'paslon1'), { name: 'Paslon 1', votes: 0, order: 1 });
                    const p2 = setDoc(doc(db, candidatesCollectionPath, 'paslon2'), { name: 'Paslon 2', votes: 0, order: 2 });
                    const p3 = setDoc(doc(db, candidatesCollectionPath, 'paslon3'), { name: 'Paslon 3', votes: 0, order: 3 });
                    await Promise.all([p1, p2, p3]);
                }
                
                // Mulai mendengarkan perubahan secara real-time
                listenToVotes();
            } catch (error) {
                console.error("Gagal inisialisasi data:", error);
            }
        }

        function listenToVotes() {
            const colRef = collection(db, candidatesCollectionPath);
            
            onSnapshot(colRef, (snapshot) => {
                let candidates = [];
                snapshot.forEach(docSnap => {
                    candidates.push({ id: docSnap.id, ...docSnap.data() });
                });
                
                // Urutkan berdasarkan 'order' supaya urutan paslon tidak acak
                candidates.sort((a, b) => a.order - b.order);
                
                // Render ke layar
                renderCandidates(candidates);
                
                // Sembunyikan loading screen setelah data pertama kali masuk
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                document.getElementById('app-content').classList.add('flex');
            }, (error) => {
                console.error("Error mendengarkan pembaruan:", error);
            });
        }

        function renderCandidates(candidates) {
            const container = document.getElementById('candidates-container');
            container.innerHTML = ''; // Bersihkan container
            
            candidates.forEach((paslon, index) => {
                // Memberikan sedikit perbedaan warna pada avatar/ikon paslon
                const colors = ['text-blue-400', 'text-blue-500', 'text-blue-600'];
                const iconColor = colors[index % colors.length];

                const cardHTML = `
                    <div class="glass-card rounded-3xl p-8 flex flex-col items-center relative overflow-hidden group">
                        
                        <!-- Dekorasi latar belakang (lingkaran transparan) -->
                        <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-100 rounded-full opacity-50 group-hover:scale-110 transition-transform duration-500 z-0"></div>
                        
                        <!-- Nomor Urut -->
                        <div class="relative z-10 bg-blue-50 text-blue-600 w-12 h-12 flex items-center justify-center rounded-full font-bold text-xl mb-4 border border-blue-100">
                            ${paslon.order}
                        </div>
                        
                        <!-- Avatar Ikon Placeholder (Kotak) -->
                        <div class="relative z-10 w-24 h-24 bg-white rounded-xl flex items-center justify-center mb-4 shadow-sm border-2 border-blue-50">
                            <svg class="w-12 h-12 ${iconColor}" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
                            </svg>
                        </div>
                        
                        <h2 class="relative z-10 text-2xl font-bold text-slate-700 mb-2">${paslon.name}</h2>
                        
                        <!-- Jumlah Suara -->
                        <div class="relative z-10 w-full bg-blue-50 rounded-2xl py-6 my-6 text-center border border-blue-100/50">
                            <span class="text-xs font-semibold text-blue-400 uppercase tracking-widest block mb-1">Total Suara</span>
                            <div class="number-transition text-7xl font-extrabold text-blue-900" id="vote-count-${paslon.id}">
                                ${paslon.votes}
                            </div>
                        </div>
                        
                        <!-- Tombol Aksi (+ / -) Hanya untuk Mobile/Tablet -->
                        <div class="relative z-10 flex w-full gap-4 mt-auto mobile-only-btn">
                            <button onclick="updateVote('${paslon.id}', -1)" class="btn-press flex-1 bg-white border-2 border-blue-100 hover:border-red-200 hover:bg-red-50 text-slate-400 hover:text-red-500 font-bold py-3 px-4 rounded-xl flex items-center justify-center shadow-sm">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M20 12H4"></path></svg>
                            </button>
                            <button onclick="updateVote('${paslon.id}', 1)" class="btn-press flex-[2] bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center shadow-md shadow-blue-500/30">
                                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                                Tambah
                            </button>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // Ekspos fungsi ke global window agar bisa dipanggil dari onclick HTML
        window.updateVote = async (paslonId, changeValue) => {
            if (!auth.currentUser) return; // Pastikan sudah login

            const docRef = doc(db, candidatesCollectionPath, paslonId);
            
            try {
                // Menggunakan increment dari Firestore untuk memastikan data akurat 
                // jika ada beberapa perangkat menekan tombol di detik yang sama
                await updateDoc(docRef, {
                    votes: increment(changeValue)
                });
                
                // Tambahkan efek animasi klik kecil pada angka
                const countEl = document.getElementById(`vote-count-${paslonId}`);
                if (countEl) {
                    countEl.style.transform = changeValue > 0 ? 'scale(1.1)' : 'scale(0.9)';
                    setTimeout(() => {
                        if (countEl) countEl.style.transform = 'scale(1)';
                    }, 150);
                }
                
            } catch (error) {
                console.error("Gagal update suara:", error);
                // Kita gunakan div pop-up sederhana sebagai ganti alert
                showNotification("Gagal mengubah suara. Coba lagi.");
            }
        };

        function showNotification(message) {
            const notif = document.createElement('div');
            notif.className = "fixed bottom-5 right-5 bg-red-500 text-white px-6 py-3 rounded-xl shadow-lg transform transition-all duration-300 translate-y-10 opacity-0 z-50";
            notif.innerText = message;
            document.body.appendChild(notif);
            
            setTimeout(() => {
                notif.classList.remove('translate-y-10', 'opacity-0');
            }, 10);
            
            setTimeout(() => {
                notif.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => notif.remove(), 300);
            }, 3000);
        }

        // Mulai aplikasi
        initAuth();

    </script>
</body>
</html>
